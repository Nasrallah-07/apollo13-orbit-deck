          if (!value || chatBusy) return;
          if (!openRouterKey) {
            chatStatus = 'Enter your OpenRouter key in assistant settings first.';
            render();
            return;
          }
          chatMessages.push({ role: 'user', content: value });
          chatBusy = true;
          chatStatus = 'Sending resource-grounded question…';
          render();
          var resourceContext = buildAssistantContext();
          var apiMessages = [{
            role: 'system',
            content: 'You are ORBIT-DECK Resource Assistant. Answer the user using the supplied NASA PSI context only. Be clear about whether information came from investigation metadata, a file inventory, or actual opened file preview. Never imply you read a file whose contents are not included. Cite accession IDs and exact filenames where applicable. If the context is insufficient, say so and suggest which listed file to open. This is research assistance, not certified flight or safety guidance.\n\nRESOURCE CONTEXT:\n' + resourceContext
          }].concat(chatMessages.slice(-8).map(function (message) {
            return { role: message.role, content: message.content };
          }));
          fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + openRouterKey,
              'Content-Type': 'application/json',
              'X-OpenRouter-Title': 'ORBIT-DECK Resource Assistant'
            },
            body: JSON.stringify({ model: 'openrouter/free', messages: apiMessages, max_tokens: 900, temperature: 0.2 })
          }).then(function (response) {
            return response.json().then(function (data) {
              if (!response.ok) throw new Error(data && data.error && data.error.message ? data.error.message : 'OpenRouter request failed (' + response.status + ')');
              return data;
            });
          }).then(function (data) {
            var answer = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (!answer) throw new Error('The model returned an empty answer.');
            chatMessages.push({ role: 'assistant', content: String(answer) });
            chatStatus = 'Answered by ' + (data.model || 'OpenRouter free model') + '. Resource context is limited to the currently loaded records and preview.';
          }).catch(function (error) {
            chatMessages.push({ role: 'assistant', error: true, content: 'Request failed: ' + (error.message || 'OpenRouter could not answer.') });
            chatStatus = 'Check the key, internet access, OpenRouter balance/rate limits, and browser network errors.';
          }).then(function () {
            chatBusy = false;
            render();
            var chatMessagesHost = el.querySelector('.sources-ai-messages');
            if (chatMessagesHost) chatMessagesHost.scrollTop = chatMessagesHost.scrollHeight;
          });
        });
        transcript.appendChild(form);

        var keyInput = h('input', {

          h('p', { text: 'Prompts include the investigation index, selected record details, public filenames, and any file preview currently loaded.' }),
          h('p', { text: 'The free router may have changing model availability and rate limits. Check provider terms before sharing sensitive data.' }),
          h('div', { class: 'sources-ai-state', role: 'status', text: chatStatus })
        ]);
        return h('section', { class: 'sources-ai', 'aria-label': 'AI resource chat' }, [transcript, settings]);
      }

      function previewSelectedFile() {
        if (!activeFile) return;
        var key = fileKey(activeFile);
        var requestId = ++previewRequestId;
        var stillSelected = function () { return requestId === previewRequestId && selectedId === selected.id && selectedFileKey === key; };
        previewState = { key: key, loading: true };
        render();
        if (!isNASA) {
          ST.getSourceBlob(activeFile.id).then(function (blob) {
            if (!stillSelected()) return;
            if (!blob) throw new Error('The imported file is not available in this browser storage.');
            var localType = (activeFile.type || '').toLowerCase();
            if (/\.(xlsx|xls)$/i.test(previewName)) return blob.arrayBuffer().then(function (buffer) { return renderSpreadsheet(buffer, key, null, stillSelected); });
            if (localType.indexOf('text/') === 0 || /\.(csv|json|txt|md|ya?ml|xml|log|dat)$/i.test(previewName)) {
              return blob.slice(0, 12000).text().then(function (text) { if (stillSelected()) previewState = { key: key, text: text }; });
            }
            if (stillSelected()) previewState = { key: key, url: URL.createObjectURL(blob), type: localType };
          }).then(function () { if (stillSelected()) render(); }).catch(function (error) {
            if (!stillSelected()) return;
            previewState = { key: key, error: error.message };
            render();
          });
          return;
        }
        presignedFileUrl(selected, activeFile).then(function (url) {
          if (!stillSelected()) return;
          if (/\.(xlsx|xls)$/i.test(previewName)) {
            if ((activeFile.file_size || 0) > 50000000) throw new Error('This spreadsheet is larger than the 50 MB inline preview limit. Use Open / Download to read the full file.');
            return fetch(url).then(function (response) {
              if (!response.ok) throw new Error('NASA spreadsheet returned ' + response.status);
              return response.arrayBuffer();
            }).then(function (buffer) { return renderSpreadsheet(buffer, key, null, stillSelected); });
          }
          if (/\.(csv|txt|json|xml|md|ya?ml|log|dat|cfg)$/i.test(previewName)) {
            return fetch(url, { headers: { Range: 'bytes=0-11999' } }).then(function (response) {
              if (!response.ok && response.status !== 206) throw new Error('NASA file preview returned ' + response.status);
              return response.text();
            }).then(function (text) { if (stillSelected()) previewState = { key: key, text: text }; });
          }
          if (/\.(pdf|png|jpe?g|gif|webp)$/i.test(previewName)) { if (stillSelected()) previewState = { key: key, url: url }; }
          else if (stillSelected()) previewState = { key: key, message: 'Inline preview is not available for this format. Open or download the original NASA file.' , url: url };

/* ============================================================
   ORBIT-DECK — test suite (build part 70)
   Environment-agnostic assertions. Runs under Node
   (scripts/orbit-deck/test-node.mjs) and in-app (Settings ▸
   Run self-tests). Covers: alertEngine transitions + hysteresis +
   debounce, stale-data boundaries, missionClock after simulated
   sleep, schema rejection of malformed telemetry, procedure
   progress persistence, CSV escaping, schedule helpers.
   ============================================================ */
(function (root) {
  'use strict';
  var OD = root.OD = root.OD || {};
  var T = OD.TESTS = { suite: [], results: null };

  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function near(a, b, eps, msg) { assert(Math.abs(a - b) <= (eps || 1e-9), (msg || 'near') + ' (' + a + ' vs ' + b + ')'); }

  function test(name, fn) { T.suite.push({ name: name, fn: fn }); }

  /* Synthetic channel used by the engine tests (decoupled from data values). */
  function chHigh() {
    return { id: 't', limits: { high: { caution: 10, warning: 12 } },
             hysteresis: 0.5, debounceMs: 1000, advisoryMargin: 0.4 };
  }
  function chLow() {
    return { id: 'l', limits: { low: { caution: 5, warning: 3 } },
             hysteresis: 0.5, debounceMs: 1000, advisoryMargin: 0.3 };
  }

  /* ---------- alertEngine: nominal → caution → warning → back ---------- */

  test('engine: nominal holds NOMINAL far from limits', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 9.5, null, 0);
    assert(s.severity === 'NOMINAL', 'expected NOMINAL, got ' + s.severity);
  });

  test('engine: advisory only commits after debounce', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s0 = DM.evaluateChannel(ch, 9.8, null, 0);          // 10 - 9.8 = 0.2 < margin 0.4
    assert(s0.severity === 'NOMINAL' && s0.pendingSev === 'ADVISORY', 'should be pending ADVISORY');
    var s1 = DM.evaluateChannel(ch, 9.8, s0, 999);           // debounce not elapsed
    assert(s1.severity === 'NOMINAL', 'not committed before debounce');
    var s2 = DM.evaluateChannel(ch, 9.8, s1, 1000);          // exactly debounceMs
    assert(s2.severity === 'ADVISORY' && s2.changed === true, 'committed at debounce boundary');
  });

  test('engine: nominal → caution → warning with debounce', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 9.5, null, 0);
    s = DM.evaluateChannel(ch, 10.5, s, 5000);               // pending CAUTION
    assert(s.severity === 'NOMINAL' && s.pendingSev === 'CAUTION', 'pending caution');
    s = DM.evaluateChannel(ch, 10.5, s, 6000);               // committed
    assert(s.severity === 'CAUTION' && s.changed, 'caution committed');
    s = DM.evaluateChannel(ch, 12.5, s, 12000);              // pending WARNING
    assert(s.severity === 'CAUTION' && s.pendingSev === 'WARNING', 'pending warning');
    s = DM.evaluateChannel(ch, 12.5, s, 13000);
    assert(s.severity === 'WARNING' && s.changed && s.cause && s.cause.side === 'high', 'warning committed, high side');
  });

  test('engine: hysteresis holds WARNING until clear threshold crossed', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 12.5, null, 0);
    s = DM.evaluateChannel(ch, 12.5, s, 1000);
    assert(s.severity === 'WARNING', 'precondition warning');
    s = DM.evaluateChannel(ch, 11.8, s, 2000);               // 11.8 >= 12-0.5 = 11.5 → still warning
    assert(s.pendingSev === 'WARNING' || s.severity === 'WARNING', 'hysteresis holds warning at 11.8');
    s = DM.evaluateChannel(ch, 11.8, s, 3000);
    assert(s.severity === 'WARNING', 'warning still committed at 11.8 (clear is 11.5)');
    s = DM.evaluateChannel(ch, 11.4, s, 5000);               // below 11.5 → raw CAUTION
    assert(s.pendingSev === 'CAUTION' && s.severity === 'WARNING', 'pending de-escalation to caution');
    s = DM.evaluateChannel(ch, 11.4, s, 6000);
    assert(s.severity === 'CAUTION' && s.changed, 'caution after hysteresis + debounce');
  });

  test('engine: hysteresis holds CAUTION until clear threshold crossed, then NOMINAL', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 10.5, null, 0);
    s = DM.evaluateChannel(ch, 10.5, s, 1000);               // CAUTION
    assert(s.severity === 'CAUTION', 'precondition caution');
    s = DM.evaluateChannel(ch, 9.7, s, 2000);                // 9.7 >= 10-0.5 = 9.5 → still caution
    s = DM.evaluateChannel(ch, 9.7, s, 3000);
    assert(s.severity === 'CAUTION', 'caution held inside hysteresis band');
    s = DM.evaluateChannel(ch, 9.4, s, 5000);                // below 9.5 → target NOMINAL (9.4 out of margin 0.4)
    s = DM.evaluateChannel(ch, 9.4, s, 6000);
    assert(s.severity === 'NOMINAL' && s.changed, 'back to NOMINAL');
  });

  test('engine: brief spike does not alert (debounce), reset clears pending', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 9.5, null, 0);
    s = DM.evaluateChannel(ch, 12.5, s, 5000);               // spike: pending WARNING
    assert(s.severity === 'NOMINAL' && s.pendingSev === 'WARNING', 'spike only pending');
    s = DM.evaluateChannel(ch, 9.0, s, 5100);                // back down before debounce elapsed
    assert(s.severity === 'NOMINAL' && s.pendingSev === null, 'spike never alerted, pending cleared');
  });

  test('engine: low-side thresholds and hysteresis mirror correctly', function () {
    var DM = OD.DOMAIN, ch = chLow();
    var s = DM.evaluateChannel(ch, 4.9, null, 0);            // pending CAUTION (≤5)
    s = DM.evaluateChannel(ch, 4.9, s, 1000);
    assert(s.severity === 'CAUTION' && s.cause.side === 'low', 'low caution committed');
    s = DM.evaluateChannel(ch, 2.9, s, 5000);
    s = DM.evaluateChannel(ch, 2.9, s, 6000);
    assert(s.severity === 'WARNING', 'low warning committed');
    s = DM.evaluateChannel(ch, 4.6, s, 9000);                // ≤ 5+0.5 = 5.5 but > 3.5 → still warning→caution pending
    s = DM.evaluateChannel(ch, 4.6, s, 10000);
    assert(s.severity === 'CAUTION', 'de-escalated only to caution (hysteresis)');
    s = DM.evaluateChannel(ch, 5.6, s, 13000);               // > 5.5 → nominal target
    s = DM.evaluateChannel(ch, 5.6, s, 14000);
    assert(s.severity === 'NOMINAL', 'recovered to NOMINAL');
  });

  test('engine: null/NaN sample keeps previous state, never invents 0', function () {
    var DM = OD.DOMAIN, ch = chHigh();
    var s = DM.evaluateChannel(ch, 10.5, null, 0);
    s = DM.evaluateChannel(ch, 10.5, s, 1000);
    var s2 = DM.evaluateChannel(ch, null, s, 2000);
    assert(s2.severity === s.severity && s2.value === null, 'null keeps state, value null');
    var s3 = DM.evaluateChannel(ch, NaN, s, 2500);
    assert(s3.value === null, 'NaN treated like missing');
    var s4 = DM.evaluateChannel(ch, undefined, null, 0);
    assert(s4.severity === 'NOMINAL' && s4.value === null, 'fresh channel with no data → NOMINAL + null value');
  });

  /* ---------- stale data ---------- */

  test('staleness: boundary — stale only strictly beyond maxAge', function () {
    var DM = OD.DOMAIN;
    var r1 = DM.staleness(5000, 10000, 14999);
    assert(r1.stale === false, 'age 4999 live');
    var r2 = DM.staleness(5000, 10000, 15000);
    assert(r2.stale === false, 'age exactly maxAge is still live');
    var r3 = DM.staleness(5000, 10000, 15001);
    assert(r3.stale === true && r3.ageMs === 5001, 'age maxAge+1 stale');
  });

  test('staleness: never-received channel is stale with no last-known value', function () {
    var DM = OD.DOMAIN;
    var r = DM.staleness(5000, null, 12345);
    assert(r.stale && r.never && r.lastTs === null && r.ageMs === null, 'never-received → NO DATA');
  });

  /* ---------- mission clock ---------- */

  test('missionClock: timestamp-based, correct after simulated 30 s tab sleep', function () {
    var DM = OD.DOMAIN;
    var t0 = 1000000;
    var clock = DM.createMissionClock(t0);
    var before = clock.metMs(t0 + 1000);
    assert(before === 1000, 'MET before sleep');
    // Simulate the wall clock having advanced 30 s (tab was asleep/throttled).
    var after = clock.metMs(t0 + 31000);
    assert(after === 31000, 'no drift: MET advanced exactly with wall clock');
    assert(after - before === 30000, 'elapsed MET equals elapsed wall time');
  });

  test('formatMet: zero, day boundary and negative (pre-launch) values', function () {
    var DM = OD.DOMAIN;
    assert(DM.formatMet(0) === 'T+000:00:00:00', 'zero → ' + DM.formatMet(0));
    assert(DM.formatMet(90061000) === 'T+001:01:01:01', '1d01:01:01 → ' + DM.formatMet(90061000));
    assert(DM.formatMet(-3600000) === 'T-000:01:00:00', 'negative → ' + DM.formatMet(-3600000));
    assert(DM.formatMet(61000) === 'T+000:00:01:01', '61 s → ' + DM.formatMet(61000));
  });

  test('formatDuration: short, hours and days', function () {
    var DM = OD.DOMAIN;
    assert(DM.formatDuration(45000) === '45 s', '45 s');
    assert(DM.formatDuration(3661000) === '01:01:01', 'h:mm:ss');
    assert(DM.formatDuration(90061000) === '1d 01:01:01', 'day included');
    assert(DM.formatDuration(null) === '—', 'null → em dash');
  });

  /* ---------- schedule helpers ---------- */

  test('nextEvent: returns soonest future event, null after schedule end', function () {
    var DM = OD.DOMAIN;
    var events = [{ id: 'a', atS: 10 }, { id: 'b', atS: 20 }, { id: 'c', atS: 30 }];
    var t0 = 0;
    var n1 = DM.nextEvent(events, t0, 5000);
    assert(n1 && n1.event.id === 'a' && n1.remainingMs === 5000, 'next is a');
    var n2 = DM.nextEvent(events, t0, 20000);
    assert(n2.event.id === 'c', 'past events skipped');
    assert(DM.nextEvent(events, t0, 31000) === null, 'after schedule → null');
  });

  test('phaseAt: returns the phase covering MET, null outside', function () {
    var DM = OD.DOMAIN;
    var phases = [{ id: 'p1', startS: 0, endS: 100 }, { id: 'p2', startS: 100, endS: 200 }];
    assert(DM.phaseAt(phases, 50000).id === 'p1', 'mid p1');
    assert(DM.phaseAt(phases, 100000).id === 'p2', 'boundary belongs to next phase');
    assert(DM.phaseAt(phases, 250000) === null, 'after mission → null');
    assert(DM.phaseAt(phases, -1000) === null, 'before liftoff → null');
  });

  /* ---------- telemetry schema (MiniZ) ---------- */

  test('schema: valid telemetry message parses', function () {
    var DM = OD.DOMAIN;
    var r = DM.MiniZ.parse(DM.telemetrySchema, { ch: 'o2pp', value: 21.2, ts: 1731500000000 });
    assert(r.ok, 'valid message accepted');
    var r2 = DM.MiniZ.parse(DM.telemetrySchema, { ch: 'o2pp', value: 21.2, ts: 1, unit: 'kPa' });
    assert(r2.ok, 'optional unit accepted');
  });

  test('schema: malformed telemetry rejected (missing/wrong type/NaN/non-object)', function () {
    var DM = OD.DOMAIN, S = DM.telemetrySchema;
    assert(!DM.MiniZ.parse(S, { ch: 'o2pp', ts: 1 }).ok, 'missing value rejected');
    assert(!DM.MiniZ.parse(S, { ch: 'o2pp', value: '21.2', ts: 1 }).ok, 'string value rejected');
    assert(!DM.MiniZ.parse(S, { ch: 'o2pp', value: NaN, ts: 1 }).ok, 'NaN rejected');
    assert(!DM.MiniZ.parse(S, { ch: 'o2pp', value: Infinity, ts: 1 }).ok, 'Infinity rejected');
    assert(!DM.MiniZ.parse(S, { value: 1, ts: 1 }).ok, 'missing channel rejected');
    assert(!DM.MiniZ.parse(S, { ch: 'o2pp', value: 1, ts: 'soon' }).ok, 'string ts rejected');
    assert(!DM.MiniZ.parse(S, 'not an object').ok, 'plain string rejected');
    assert(!DM.MiniZ.parse(S, null).ok, 'null rejected');
    var r = DM.MiniZ.parse(S, { ch: 'o2pp', ts: 1 });
    assert(!r.ok && r.errors.length > 0 && r.errors[0].indexOf('value') !== -1, 'error paths reported');
  });

  /* ---------- persistence: procedure progress survives reload ---------- */

  test('procedure progress persists across a simulated reload', function () {
    var ST = OD.STORE;
    var a = makeShim();
    ST.useStorage(a);
    ST.saveProc('fire', { steps: { s1: 'done', s2: 'skip' }, cursor: 2 });
    // Simulate a reload: fresh storage shim seeded from the same serialized data.
    var b = makeShim(JSON.parse(JSON.stringify(a.__data)));
    ST.useStorage(b);
    var rec = ST.getProc('fire');
    assert(rec && rec.steps.s1 === 'done' && rec.steps.s2 === 'skip' && rec.cursor === 2,
           'progress survived reload');
    ST.useStorage(null);
  });

  function makeShim(seed) {
    var data = seed || {};
    return {
      __data: data,
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function (k, v) { data[k] = String(v); },
      removeItem: function (k) { delete data[k]; },
      clear: function () { data = {}; this.__data = data; }
    };
  }

  /* ---------- CSV ---------- */

  test('csv: quoting of commas, quotes and newlines; CRLF line endings', function () {
    var DM = OD.DOMAIN;
    assert(DM.csvEscape('a,b') === '"a,b"', 'comma quoted');
    assert(DM.csvEscape('say "hi"') === '"say ""hi"""', 'quote doubled');
    assert(DM.csvEscape('l1\nl2') === '"l1\nl2"', 'newline contained');
    var csv = DM.toCsv(['t', 'msg'], [[1, 'x']]);
    assert(csv.indexOf('\r\n') !== -1 && csv.split('\r\n').length >= 3, 'CRLF rows');
  });

  /* ---------- formatting ---------- */

  test('fmt: null/undefined render as em dash, never 0; unit conversion applies', function () {
    var DM = OD.DOMAIN;
    var ch = { id: 'x', unit: 'kPa', conv: 'pressure', decimals: 1 };
    assert(DM.fmt(ch, null, 'metric') === '—', 'null → —');
    assert(DM.fmt(ch, undefined, 'metric') === '—', 'undefined → —');
    near(DM.displayValue(ch, 101.3, 'imperial'), 14.7, 0.05, 'kPa→psi');
    var chT = { id: 'y', unit: '°C', conv: 'temp', decimals: 1 };
    near(DM.displayValue(chT, 21.5, 'imperial'), 70.7, 0.05, '°C→°F');
    assert(DM.fmt(chT, 21.5, 'metric') === '21.5 °C', 'metric passthrough');
  });

  test('trend: positive slope for rising series, 0 for too-few samples', function () {
    var DM = OD.DOMAIN;
    var s = [{ t: 0, v: 10 }, { t: 10000, v: 12 }];
    near(DM.trendOf(s, 10000, 30000), 0.2, 1e-9, '0.2 units/s');
    assert(DM.trendOf([{ t: 0, v: 1 }], 0, 30000) === 0, 'single sample → 0');
    assert(DM.trendOf(null, 0, 30000) === 0, 'null series → 0');
  });

  /* ---------- simulator determinism + fault script ---------- */

  test('simulator: values are deterministic (pure function of scenario time)', function () {
    var TL = OD.TELEMETRY, D = OD.DATA;
    TL.createSimulated({ hooks: {}, scenarioStart: function () { return Date.now(); } });
    var ch = D.channels[0];
    var scen = { start: function () { return 1000000; } };
    var v1 = TL._valueAt(ch, 123456);
    var v2 = TL._valueAt(ch, 123456);
    assert(v1 === v2, 'same MET → same value');
    assert(typeof v1 === 'number' && isFinite(v1), 'finite number');
    var nearBase = Math.abs(v1 - ch.sim.base) <= ch.sim.amp + ch.sim.noise + 1;
    assert(nearBase, 'value near baseline envelope');
  });

  test('simulator: scripted CO₂ excursion crosses caution then warning limits', function () {
    var TL = OD.TELEMETRY, D = OD.DATA;
    TL.createSimulated({ hooks: {}, scenarioStart: function () { return Date.now(); } });
    var ch = D.channels.filter(function (c) { return c.id === 'co2pp'; })[0];
    var v0 = TL._valueAt(ch, 10000);                 // t = 10 s: nominal
    assert(v0 < ch.limits.high.caution, 'nominal before script start');
    var vPeak = TL._valueAt(ch, 200000);             // t = 200 s: inside fault hold
    assert(vPeak >= ch.limits.high.warning, 'above warning limit during fault');
    var vAfter = TL._valueAt(ch, 400000);            // t = 400 s: fault over
    assert(vAfter < ch.limits.high.caution, 'recovered after fault');
  });

  test('simulator: comms-loss fault stops exactly the comms channels for its window', function () {
    var TL = OD.TELEMETRY;
    var def = TL.SCRIPT.filter(function (f) { return f.id === 'comms'; })[0];
    assert(def.kind === 'stale' && def.chans.indexOf('sig') !== -1 && def.chans.indexOf('dnl') !== -1,
           'comms channels listed');
    assert(def.start + def.dur > def.start, 'finite window');
  });

  test('simulator: manual bus-voltage dip is shorter than its debounce (never alerts)', function () {
    var D = OD.DATA, TL = OD.TELEMETRY;
    var bus = D.channels.filter(function (c) { return c.id === 'busv'; })[0];
    var def = TL.SCRIPT.filter(function (f) { return f.id === 'bus'; })[0];
    var dur = def.rise + def.hold + def.fall;
    assert(dur < bus.debounceMs / 1000, 'fault duration ' + dur + ' s < debounce ' + bus.debounceMs / 1000 + ' s');
  });

  test('simulator: manual injection activates immediately (regression: def wrapper bug)', function () {
    var TL = OD.TELEMETRY, D = OD.DATA;
    // scenarioStart = now → an injected fault anchors near scenario second 0.
    var p = TL.createSimulated({ hooks: {}, scripted: false,
                                 scenarioStart: function () { return Date.now(); } });
    var co2 = D.channels.filter(function (c) { return c.id === 'co2pp'; })[0];
    var vNoFault = TL._valueAt(co2, 30000);
    p.injectFault('co2');
    var active = TL._activeFaults(30);
    assert(active.some(function (f) { return f.key.indexOf('m:co2') === 0; }),
           'manual co2 fault active after injection');
    var vFault = TL._valueAt(co2, 30000);
    assert(vFault > vNoFault + 0.3, 'manual fault raises CO₂ value (' + vFault + ' > ' + vNoFault + ')');
  });

  /* ---------- live provider message handling ---------- */

  test('live provider: valid message applies, malformed rejected and logged', function () {
    var TL = OD.TELEMETRY;
    var events = [], samples = [], statuses = [];
    var p = TL.createLive({
      url: 'ws://example.invalid/telemetry',
      hooks: {
        onEvent: function (e) { events.push(e); },
        onSample: function (ch, s) { samples.push([ch, s]); },
        onStatus: function (s) { statuses.push(s.state); }
      }
    });
    assert(TL._handleLiveMessage('not json') === false, 'bad JSON rejected');
    assert(TL._handleLiveMessage('{"ch":"o2pp","value":"x","ts":1}') === false, 'wrong type rejected');
    assert(TL._handleLiveMessage('{"ch":"nope","value":1,"ts":1}') === false, 'unknown channel rejected');
    assert(TL._handleLiveMessage('{"ch":"o2pp","value":21.2,"ts":1731500000000}') === true, 'valid accepted');
    assert(samples.length === 1 && samples[0][0] === 'o2pp', 'sample applied once');
    assert(events.length === 3 && events.every(function (e) { return e.type === 'provider'; }), 'each rejection logged');
    assert(p.getSnapshot().o2pp.value === 21.2, 'snapshot updated');
  });

  /* ---------- i18n completeness ---------- */

  test('i18n: every EN key has an FR translation', function () {
    var D = OD.DATA, bad = [];
    Object.keys(D.i18n).forEach(function (k) {
      if (!D.i18n[k].fr) bad.push(k);
    });
    D.channels.forEach(function (c) {
      if (!c.name.fr) bad.push('channel:' + c.id);
      if (!c.name.en) bad.push('channel-en:' + c.id);
    });
    D.procedures.forEach(function (p) {
      if (!p.title.fr) bad.push('proc:' + p.id);
      p.steps.forEach(function (s) { if (!s.text.fr) bad.push('step:' + p.id + ':' + s.id); });
    });
    D.events.forEach(function (e) { if (!e.name.fr) bad.push('event:' + e.id); });
    D.phases.forEach(function (p) { if (!p.name.fr) bad.push('phase:' + p.id); });
    assert(bad.length === 0, 'missing FR for: ' + bad.join(', '));
  });

  test('data integrity: every channel has PLACEHOLDER-labelled limits + timings', function () {
    var D = OD.DATA;
    D.channels.forEach(function (c) {
      assert(c.limits && (c.limits.low || c.limits.high), 'limits on ' + c.id);
      assert(c.maxAgeMs > 0 && c.debounceMs > 0 && c.hysteresis > 0, 'timings on ' + c.id);
      assert(c.sim && typeof c.sim.base === 'number', 'sim baseline on ' + c.id);
    });
    assert(D.notices.placeholderLimits.en.indexOf('PLACEHOLDER') !== -1, 'placeholder notice present');
  });

  OD.TESTS.runAll = function () {
    var out = [];
    var passed = 0, failed = 0;
    T.suite.forEach(function (t) {
      try { t.fn(); passed++; out.push({ name: t.name, ok: true }); }
      catch (e) { failed++; out.push({ name: t.name, ok: false, err: String(e && e.message || e) }); }
    });
    T.results = { passed: passed, failed: failed, out: out };
    return T.results;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

window.addEventListener("DOMContentLoaded", function () {

    var d = document.createElement("pre");
    d.id = "init-error";
    d.textContent = "INIT ERROR: " + ((e && e.stack) || e);
    document.body.appendChild(d);
    throw e;
  }
});
</script>
